schema_version: 1

context:
  name: ibm-cloud-sdk-core
  version: "3.28.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0d2bd7b835e0cbb0d3ad22d7b8de8ead0cce395261f4df4ec343152235bdc758

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=67.7.2
  run:
    - pyjwt >=2.11.0,<3.0.0
    - python >=${{ python_min }}
    - python-dateutil >=3.0.0,<3.1.0
    - requests >=2.32.4,<3.0.0
    - urllib3 >=2.4.0,<3.0.0
tests:
  - python:
      imports:
        - ibm_cloud_sdk_core
        - ibm_cloud_sdk_core.authenticators
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Core library used by SDKs for IBM Cloud Services
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/IBM/python-sdk-core

extra:
  recipe-maintainers:
    - synapticarbors
    - BastianZim
